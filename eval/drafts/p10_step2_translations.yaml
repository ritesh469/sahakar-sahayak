# P10 step 2: translations of the approved questions (written by Claude; checked by a native
# speaker, the author, on 2026-09-30: all approved unchanged, see p10_step2_translation_review.xlsx).
# base_id -> language -> question. For fake_premise questions a language may give
# {question, correct_facts}: regexes of the correct fact in the language the answer will be in.
# scripts/build_coop_questions.py merges this file with the step 1 / step 3 drafts into
# eval/coop_questions.yaml.

# --- answerable (step 1 drafts are English) -----------------------------------------------------
ans-001:
  hi: "बजट 2022-23 में सहकारी समितियों के लिए वैकल्पिक न्यूनतम कर (AMT) को किस दर तक घटाया गया, और पहले यह कितना था?"
  mr: "अर्थसंकल्प 2022-23 मध्ये सहकारी संस्थांसाठी पर्यायी किमान कर (AMT) कोणत्या दरापर्यंत कमी करण्यात आला आणि आधी तो किती होता?"
  hinglish: "Budget 2022-23 mein cooperative societies ke liye Alternate Minimum Tax kitna kar diya gaya, aur pehle kitna tha?"
ans-002:
  hi: "बजट 2023-24 के संशोधन के बाद कोई सदस्य प्राथमिक कृषि ऋण समिति (PACS) में कितनी राशि से कम नकद जमा कर सकता है या नकद ऋण ले सकता है, जिस पर कोई दंड न लगे?"
  mr: "अर्थसंकल्प 2023-24 मधील सुधारणेनंतर सभासद प्राथमिक कृषी पतसंस्थेत (PACS) किती रकमेपेक्षा कमी रोख ठेव ठेवू शकतो किंवा रोख कर्ज घेऊ शकतो, ज्यावर कोणताही दंड लागत नाही?"
  hinglish: "Budget 2023-24 ke amendment ke baad PACS mein member kitne amount se kam cash deposit kar sakta hai ya cash loan le sakta hai bina kisi penalty ke?"
ans-003:
  hi: "सहकारी समितियों को बिना TDS के नकद निकासी की कितनी सीमा दी गई है?"
  mr: "सहकारी संस्थांना TDS शिवाय रोख रक्कम काढण्याची किती मर्यादा देण्यात आली आहे?"
  hinglish: "Cooperative societies ke liye bina TDS ke cash withdrawal ki limit kitni hai?"
ans-004:
  hi: "सहकारी चीनी मिलों के लिए NCDC को दी गई अनुदान सहायता योजना का कुल परिव्यय कितना है और यह राशि कैसे जारी की जाएगी?"
  mr: "सहकारी साखर कारखान्यांसाठी NCDC ला दिलेल्या अनुदान योजनेचा एकूण परिव्यय किती आहे आणि ही रक्कम कशी वितरित केली जाईल?"
  hinglish: "Cooperative sugar mills ke liye NCDC ko grant-in-aid scheme ka total outlay kitna hai aur paisa kaise release hoga?"
ans-005:
  hi: "NCDC सहकारी चीनी मिल को इथेनॉल परियोजना की लागत का अधिकतम कितना हिस्सा सावधि ऋण (टर्म लोन) के रूप में देता है?"
  mr: "NCDC सहकारी साखर कारखान्याला इथेनॉल प्रकल्पाच्या खर्चाच्या जास्तीत जास्त किती टक्के मुदत कर्ज देते?"
  hinglish: "NCDC cooperative sugar mill ko ethanol project cost ka kitna percent term loan deta hai?"
ans-006:
  hi: "भारत की कितनी सहकारी चीनी मिलें बंद (निष्क्रिय) पड़ी हैं?"
  mr: "भारतातील किती सहकारी साखर कारखाने बंद (अकार्यरत) आहेत?"
  hinglish: "India mein kitni cooperative sugar mills band padi hain?"
ans-007:
  hi: "कॉमन सर्विस सेंटर (CSC) पर पीएम-किसान का बायोमेट्रिक ई-केवाईसी करवाने का सुविधा शुल्क कितना है?"
  mr: "कॉमन सर्व्हिस सेंटरवर (CSC) पीएम-किसानचे बायोमेट्रिक ई-केवायसी करण्यासाठी किती सुविधा शुल्क आकारले जाते?"
  hinglish: "CSC par PM-KISAN ka biometric e-KYC karwane ki fees kitni lagti hai?"
ans-008:
  hi: "ई-केवाईसी पूरा होने के कितने समय बाद वह पीएम-किसान लाभार्थी स्थिति (बेनिफिशियरी स्टेटस) में दिखता है?"
  mr: "ई-केवायसी पूर्ण झाल्यानंतर किती वेळाने ते पीएम-किसान लाभार्थी स्थितीमध्ये दिसते?"
  hinglish: "e-KYC complete hone ke kitne time baad PM-KISAN beneficiary status mein dikhta hai?"
ans-009:
  hi: "पीएम-किसान के लिए ओटीपी आधारित ई-केवाईसी करने के लिए किसान के पास क्या होना चाहिए?"
  mr: "पीएम-किसानसाठी ओटीपी आधारित ई-केवायसी करण्यासाठी शेतकऱ्याकडे काय असणे आवश्यक आहे?"
  hinglish: "PM-KISAN ka OTP wala e-KYC karne ke liye farmer ke paas kya hona chahiye?"
ans-010:
  hi: "पीएम-किसान के तहत लाभार्थियों की पात्रता तय करने की कट-ऑफ तारीख क्या है?"
  mr: "पीएम-किसान योजनेअंतर्गत लाभार्थ्यांची पात्रता ठरवण्याची कट-ऑफ तारीख कोणती आहे?"
  hinglish: "PM-KISAN mein beneficiary eligibility decide karne ki cut-off date kya hai?"
ans-011:
  hi: "क्या सेवानिवृत्त पेंशनभोगी पीएम-किसान का लाभ पाने के पात्र हैं?"
  mr: "सेवानिवृत्त निवृत्तीवेतनधारक पीएम-किसानच्या लाभासाठी पात्र आहेत का?"
  hinglish: "Kya retired pensioners PM-KISAN ka benefit le sakte hain?"
ans-012:
  hi: "पीएम-किसान के तहत भूमिधारक किसान परिवार की परिभाषा क्या है?"
  mr: "पीएम-किसान योजनेत जमीनधारक शेतकरी कुटुंबाची व्याख्या काय आहे?"
  hinglish: "PM-KISAN mein landholder farmer family ki definition kya hai, family mein kaun kaun aata hai?"
ans-013:
  hi: "पीएम-किसान की राष्ट्रीय स्तर की समीक्षा समिति की अध्यक्षता कौन करता है?"
  mr: "पीएम-किसानच्या राष्ट्रीय स्तरावरील आढावा समितीचे अध्यक्ष कोण असतात?"
  hinglish: "PM-KISAN ki national level review committee ko kaun head karta hai?"
ans-014:
  hi: "पीएम-किसान योजना किस तारीख से लागू मानी गई है?"
  mr: "पीएम-किसान योजना कोणत्या तारखेपासून लागू आहे?"
  hinglish: "PM-KISAN scheme kis date se lagu hai?"
ans-015:
  hi: "अनुमान के अनुसार लगभग कितने किसान परिवार पीएम-किसान के पात्र थे?"
  mr: "अंदाजानुसार सुमारे किती शेतकरी कुटुंबे पीएम-किसानसाठी पात्र होती?"
  hinglish: "Andaaz ke hisaab se lagbhag kitne farmer families PM-KISAN ke liye eligible thi?"
ans-016:
  hi: "पीएम-किसान पर अनुमानित वार्षिक खर्च कितना है?"
  mr: "पीएम-किसानवर अंदाजे वार्षिक खर्च किती आहे?"
  hinglish: "PM-KISAN par saal ka estimated kharcha kitna hai?"
ans-017:
  hi: "प्रधानमंत्री किसान मान-धन योजना में शामिल होने की आयु सीमा क्या है?"
  mr: "प्रधानमंत्री किसान मानधन योजनेत सहभागी होण्यासाठी वयोमर्यादा किती आहे?"
  hinglish: "PM Kisan Maan-Dhan Yojana mein join karne ki age limit kya hai?"
ans-018:
  hi: "पीएम किसान मान-धन योजना में किसान को हर महीने कितना अंशदान देना होता है?"
  mr: "पीएम किसान मानधन योजनेत शेतकऱ्याला दरमहा किती योगदान द्यावे लागते?"
  hinglish: "PM Kisan Maan-Dhan mein farmer ko har mahine kitna contribution dena padta hai?"
ans-019:
  hi: "पीएम किसान मान-धन योजना का पेंशन फंड मैनेजर कौन है?"
  mr: "पीएम किसान मानधन योजनेचा पेन्शन फंड व्यवस्थापक कोण आहे?"
  hinglish: "PM Kisan Maan-Dhan Yojana ka pension fund manager kaun hai?"
ans-020:
  hi: "यदि पेंशन पा रहे पीएम किसान मान-धन लाभार्थी की मृत्यु हो जाए तो उसके पति/पत्नी को क्या मिलता है?"
  mr: "पेन्शन मिळत असताना पीएम किसान मानधन लाभार्थ्याचा मृत्यू झाल्यास पती/पत्नीला काय मिळते?"
  hinglish: "Agar PM Kisan Maan-Dhan ka subscriber pension lete hue mar jaaye to spouse ko kya milta hai?"
ans-021:
  hi: "पीएम किसान मान-धन योजना किस तारीख से प्रभावी है?"
  mr: "पीएम किसान मानधन योजना कोणत्या तारखेपासून लागू आहे?"
  hinglish: "PM Kisan Maan-Dhan Yojana kis date se effective hai?"
ans-022:
  hi: "राष्ट्रीय सहकारिता नीति 2025 का मसौदा तैयार करने वाली समिति के अध्यक्ष कौन थे और उसमें कितने सदस्य थे?"
  mr: "राष्ट्रीय सहकार धोरण 2025 चा मसुदा तयार करणाऱ्या समितीचे अध्यक्ष कोण होते आणि त्यात किती सदस्य होते?"
  hinglish: "National Cooperation Policy 2025 ka draft banane wali committee ke chairman kaun the aur usme kitne members the?"
ans-023:
  hi: "राष्ट्रीय सहकारिता नीति में बताई गई SOP के तहत जिन पंचायतों में अभी कोई समिति नहीं है, वहाँ कितनी नई PACS, डेयरी और मत्स्य सहकारी समितियाँ बनाई जानी हैं?"
  mr: "राष्ट्रीय सहकार धोरणात उल्लेख केलेल्या SOP अंतर्गत संस्था नसलेल्या पंचायतींमध्ये किती नवीन PACS, दुग्ध आणि मत्स्य सहकारी संस्था स्थापन करायच्या आहेत?"
  hinglish: "NCP ke SOP ke under uncovered panchayats mein kitni nayi PACS, dairy aur fishery cooperatives banani hain?"
ans-024:
  hi: "सहकारिता नीति पर राष्ट्रीय संचालन समिति (नेशनल स्टीयरिंग कमेटी) की अध्यक्षता कौन करेगा?"
  mr: "सहकार धोरणावरील राष्ट्रीय सुकाणू समितीचे अध्यक्ष कोण असतील?"
  hinglish: "Cooperation Policy ki National Steering Committee ko kaun chair karega?"
ans-025:
  hi: "राष्ट्रीय सहकारिता नीति 2025 का लक्ष्य कितने लोगों को सहकारिता के दायरे में लाना है?"
  mr: "राष्ट्रीय सहकार धोरण 2025 चे किती लोकांना सहकार क्षेत्राच्या कक्षेत आणण्याचे उद्दिष्ट आहे?"
  hinglish: "NCP 2025 kitne logon ko cooperatives se jodne ka target rakhti hai?"
ans-026:
  hi: "विश्व की सबसे बड़ी अनाज भंडारण योजना के पायलट में कितनी PACS में गोदाम बनकर तैयार हुए और कितनी भंडारण क्षमता बनी?"
  mr: "जगातील सर्वात मोठ्या धान्य साठवण योजनेच्या पथदर्शी प्रकल्पात किती PACS मध्ये गोदामे पूर्ण झाली आणि किती साठवण क्षमता निर्माण झाली?"
  hinglish: "Grain storage plan ke pilot mein kitne PACS mein godown complete hue aur kitni storage capacity bani?"
ans-027:
  hi: "अनाज भंडारण योजना की अंतर-मंत्रालयी समिति की अध्यक्षता कौन करता है?"
  mr: "धान्य साठवण योजनेसाठीच्या आंतर-मंत्रालयीन समितीचे अध्यक्ष कोण आहेत?"
  hinglish: "Grain storage plan ki Inter-Ministerial Committee ko kaun chair karta hai?"
ans-028:
  hi: "अनाज भंडारण परियोजना के लिए कृषि अवसंरचना कोष (AIF) के तहत PACS को कितनी ब्याज छूट (इंटरेस्ट सबवेंशन) मिलती है?"
  mr: "धान्य साठवण प्रकल्पासाठी कृषी पायाभूत सुविधा निधी (AIF) अंतर्गत PACS ला किती व्याज सवलत मिळते?"
  hinglish: "Grain storage project ke liye AIF ke under PACS ko kitna interest subvention milta hai?"
ans-029:
  hi: "अनाज भंडारण योजना में AMI के तहत PACS को अब कितनी सब्सिडी मिल सकती है और मार्जिन मनी की शर्त क्या है?"
  mr: "धान्य साठवण योजनेत AMI अंतर्गत PACS ला आता किती अनुदान मिळू शकते आणि मार्जिन मनीची अट काय आहे?"
  hinglish: "Grain storage plan mein AMI ke under PACS ko ab kitni subsidy milti hai aur margin money kitna chahiye?"
ans-030:
  hi: "महाराष्ट्र महिला किसान सशक्तिकरण अधिनियम, 2026 के तहत किसे महिला किसान के रूप में मान्यता मिल सकती है?"
  mr: "महाराष्ट्र महिला शेतकरी सक्षमीकरण अधिनियम, 2026 अंतर्गत कोणाला महिला शेतकरी म्हणून मान्यता मिळू शकते?"
  hinglish: "Maharashtra Women Farmers Empowerment Act 2026 mein kise woman farmer maana ja sakta hai?"
ans-031:
  hi: "ग्राम सभा द्वारा आवेदक को मान्यता देने का प्रस्ताव पारित होने के बाद नामित अधिकारी को कितने दिनों में महिला किसान प्रमाणपत्र जारी करना होता है?"
  mr: "ग्रामसभेने अर्जदाराला मान्यता देणारा ठराव मंजूर केल्यानंतर पदनिर्देशित अधिकाऱ्याने किती दिवसांत महिला शेतकरी प्रमाणपत्र द्यावे लागते?"
  hinglish: "Gram Sabha ka resolution pass hone ke baad Designated Officer ko kitne din mein Woman Farmer Certificate dena hota hai?"
ans-032:
  hi: "महाराष्ट्र में महिला किसान सशक्तिकरण परिषद की अध्यक्षता कौन करता है?"
  mr: "महाराष्ट्रातील महिला शेतकरी सक्षमीकरण परिषदेचे अध्यक्ष कोण असतात?"
  hinglish: "Maharashtra mein Women Farmers Empowerment Council ka chairperson kaun hai?"
ans-033:
  hi: "अगर ग्राम सभा महिला किसान प्रमाणपत्र का आवेदन खारिज कर दे तो आवेदक कितने समय के अंदर अपील कर सकती है?"
  mr: "ग्रामसभेने महिला शेतकरी प्रमाणपत्राचा अर्ज फेटाळल्यास अर्जदार महिला किती कालावधीत अपील करू शकते?"
  hinglish: "Agar Gram Sabha woman farmer certificate ki application reject kar de to kitne time mein appeal kar sakte hain?"
ans-034:
  hi: "पुण्यश्लोक अहिल्यादेवी होलकर किसान कर्ज माफी योजना 2026 के तहत अधिकतम कितनी राशि तक कर्ज माफ किया जाता है?"
  mr: "पुण्यश्लोक अहिल्यादेवी होळकर शेतकरी कर्जमुक्ती योजना 2026 अंतर्गत जास्तीत जास्त किती रकमेपर्यंत कर्जमुक्ती दिली जाते?"
  hinglish: "Punyashlok Ahilyadevi Holkar loan waiver scheme 2026 mein kitne rupaye tak ka loan maaf hota hai?"
ans-035:
  hi: "2026 की कर्ज माफी योजना में नियमित रूप से फसल ऋण चुकाने वाले किसानों को क्या लाभ मिलता है?"
  mr: "2026 च्या कर्जमुक्ती योजनेत पीक कर्जाची नियमित परतफेड करणाऱ्या शेतकऱ्यांना कोणता लाभ मिळतो?"
  hinglish: "2026 loan waiver scheme mein jo farmers crop loan time par chukate hain unhe kya benefit milta hai?"
ans-036:
  hi: "2026 की योजना में कौन से फसल ऋण कर्ज माफी के दायरे में आते हैं?"
  mr: "2026 च्या योजनेत कोणती पीक कर्जे कर्जमुक्तीसाठी पात्र आहेत?"
  hinglish: "2026 scheme mein kaun se crop loans loan waiver ke under aate hain?"
ans-037:
