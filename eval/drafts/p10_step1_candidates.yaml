- id: ans-001-en
  base_id: ans-001
  language: en
  type: answerable
  question: To what rate was the Alternate Minimum Tax for cooperative societies reduced in Budget 2022-23, and
    what was it before?
  expected_answer: It was reduced from 18.5% to 15%, the same rate that companies pay.
  supporting_text: Cooperative societies were required to pay Alternate Minimum Tax at the rate of 18.5%. However,
    companies paid the same at the rate of 15%. To provide a level playing field between co-operative societies
    and companies, the rate for the cooperative societies have also been reduced to 15%.
  relevant_documents:
  - source: coop_income_tax_benefits.pdf
    page: 1
  verified: false
  notes: P10 step 1 candidate (Income tax benefits); needs human approval
